{% extends "base.html" %}

{% block title%}Meeting: {{meeting.title}}{%endblock%}

{% block content%}
<h1>{{meeting.title}}</h1>

<p>
    This meeting has been scheduled on {{meeting.date}}, at {{meeting.start_time}} in <strong>{{meeting.room_number}}</strong>  
</p>

<p> 
    <a href="{%url 'edit' meeting.id%}">Edit this meeting</a><br>
    <a href="{%url 'delete' meeting.id%}">Delete this meeting</a><br>
    <a href="{% url 'welcome' %}">Go home</a>
    
</p>
{%endblock%}
