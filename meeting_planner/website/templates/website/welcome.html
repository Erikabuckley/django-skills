{% extends "base.html" %}
{% block title%}Welcome{%endblock%}
{% block content%}
    <h1>Welcome to the Meeting Planner!</h1>

    <p>
        This is the demo application for the course
        <em>Django Fundamentals</em>
    </p>

    <h2>Meetings</h2>

    <ul>
        {% for meeting in meetings %}
        <li>
            <a href="{% url 'detail' meeting.id %}">
                {{meeting.title}}
            </a>
        </li>
        {% endfor %}
    </ul>
{%endblock%}
