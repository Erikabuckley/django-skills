{% extends "base.html" %}
{% load static %}


{% block title%}Rooms list{%endblock%}

{% block content%}
    <h1>Rooms list</h1>

    <div class="card">
        <div class="item">
            {% for room in rooms %}
                <p>{{room}}</p>
            {% endfor %}
        </div>
        <div class="item">
            <img src="{% static 'website/floorplan.png' %}" id="floorplan">
        </div>
    </div>

    <p class="actions"><a href="{% url 'welcome' %}">Go home</a></p>

{%endblock%}
