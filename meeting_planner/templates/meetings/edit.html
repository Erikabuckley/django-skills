{% extends "base.html" %}

{% block title%}Change Meeting: {{meeting.title}}{%endblock%}

{% block content%}
<h1>Change meeting</h1>
<form method="post" class='form'>
    <table>
        {{form}}
    </table>
    {% csrf_token %}
    <button type="submit" class="in-button">Confirm changes</button>
</form>


<div>
    <p class="actions"> 
        <a href="{% url 'welcome' %}">Go home</a>
    </p>
</div>
{%endblock%}
