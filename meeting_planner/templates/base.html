{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</Title>
    <link rel="stylesheet" href="{% static 'website/style.css' %}">
    <script defer src="{% static 'website/base.js' %}"></script>
    <link rel="icon" type="image/x-icon" href="{% static 'website/icon.png' %}">
</head>

{% block extra_scripts %}{% endblock %}
<body>
        {% if user.is_authenticated %}
        <div class="login ">
            <div class="name"> 
                <img src="{% static 'website/profile.jpg' %}" id="profile">
                Logged in as: {{user.get_username}}
            </div>
            <h1 style="padding:0.5rem"> Meeting Planner</h1>
            <form method="post" action="{%url 'logout'%}">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        </div>
        {%else %}
        <div class="login ">
            <div></div>
            <h1 style="padding:0.5rem"> Meeting Planner</h1>
            <form method="get" action="{% url 'login' %}">
                <button type="submit">Login</button>
            </form>    
        {%endif%}
    </div>

    <div class="content">
    {% block content %}
    {% endblock%}
    </div>
    
    <div id="footer">
        Contrast:
        <label class="switch">
            <input type="checkbox" id="darklight">
            <span class="slider round"></span>
        </label>
    </div>

</body>
</html>
