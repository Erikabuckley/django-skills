<div id="todo-{{ todo.id }} todo-bullet">
    <span>{{ todo.name }}</span>
    <button
        hx-post="{% url 'todo_complete' todo.id %}"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        hx-target="closest div"
        hx-swap="outerHTML"
        hx-confirm="Mark this todo as completed?"
        class="in-button">
        Done
    </button>
</div>
