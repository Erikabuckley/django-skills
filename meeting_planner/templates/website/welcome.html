{% extends "base.html" %}
{% block title%}Welcome{%endblock%}
{% block content%}
<h1>Welcome to the Meeting Planner!</h1>

 {% if user.is_authenticated %}
    <h2>Current Meetings</h2>
    <ul>
        {% for meeting in meetings %}
        <li>
            <a href="{% url 'detail' meeting.id %}">
                {{meeting.title}}
            </a>
        </li>
        {% endfor %}
    </ul>
    <div class="rooms">
        <a href="{%url 'rooms'%}">View rooms in the building</a>
    </div>
{% endif%}

{%endblock%}
