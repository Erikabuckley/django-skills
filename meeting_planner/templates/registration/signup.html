{% extends "base.html" %}

{% block content%}

{% if form.errors %}
    <p>Your username and password didn't match. Please try again.</p>
{% endif %}
<form method="post" class="form">
    <h1>Sign up</h1>
    <table>
        {{form}}
    </table>
    {% csrf_token %}
    <button type="submit" value="Sign up" >Sign up</button>
</form>

{%endblock%}
