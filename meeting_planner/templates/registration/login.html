{% extends "base.html" %}
{% load static %}

{% block extra_scripts %}
    <link rel="stylesheet" href="{% static 'website/auth.css' %}">
{% endblock %}

{% block content%}

{% if form.errors %}
    <p>Your username and password didn't match. Please try again.</p>
{% endif %}
<form method="post" class="form">
    <h1>Login to your account</h1>
    <table>
        {{form}}
    </table>
    {% csrf_token %}
    <button type="submit" value="Login" class="in-button">Login</button>

    <a id="create" href="{% url 'signup'%}" >Click here to create an account</a>

</form>



{%endblock%}
